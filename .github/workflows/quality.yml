name: Code-Quality

on: [ push ]

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r python/dev-requirements.txt

      - name: Run pyright
        working-directory: python
        run: pyright src

      - name: Run pylint
        working-directory: python
        run: pylint src
