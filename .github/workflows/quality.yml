name: Code-Quality

on: [ push ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python -m pip install -r dev-requirements.txt

      - name: Run pyright
        run: pyright ./zyntex

      - name: Run pylint
        run: pylint ./zyntex